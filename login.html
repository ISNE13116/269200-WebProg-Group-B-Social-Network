<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MorCor MaChill</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth">
    <div class="wrap">
        <div class="strip"></div>

        <aside class="brand">
            <div class="mini"><span>MorCor<br>MaChill</span>
                <i><img src="pic/logo.png" alt="logo" class="logo"></i>
            </div>
            <div class="big"><img src="pic/logo-big.png" alt="logo" class="logo">MorCor<br>MaChill</div>
        </aside>

        <main class="stage">
            <div class="card">
                <div class="header-banner" id="headerBanner">LOGIN</div>

                <form id="authForm" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <div class="field">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6"/></svg>
                            <input type="text" id="username" class="form-input" placeholder="@cmu.ac.th" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="field">
                            <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                            <input type="password" id="password" class="form-input has-eye" placeholder="Password" autocomplete="current-password" required>
                            <button type="button" class="eye" id="eyeBtn" title="Show password" aria-label="Show password" onmousedown="event.preventDefault()" onclick="togglePassword()">
                                <svg id="eyeOpen" viewBox="0 0 24 24" hidden><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg id="eyeOff" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group hidden" id="confirmPasswordGroup">
                        <div class="field">
                            <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                            <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm Password" autocomplete="new-password">
                        </div>
                    </div>

                    <div class="form-group hidden" id="facultyGroup">
                        <label class="form-label" for="faculty">Faculty</label>
                        <div class="field">
                            <select id="faculty" class="form-input" style="padding-left: 20px;">
                                <option value="" disabled selected>Select your faculty</option>
                            </select>
                        </div>
                    </div>

                    <div class="msg" id="msg"></div>
                    <button type="submit" class="btn-action" id="submitBtn">Login</button>
                </form>

                <button type="button" class="toggle-link" id="toggleBtn" onclick="toggleView()">Create a new account</button>
            </div>
        </main>
    </div>

<script>
    const USERS_KEY = 'cmuh-users';
    const SESSION_KEY = 'cmuh-session';
    const FEED_PAGE = 'index.html';

    const FACULTIES = [
        "Chiang Mai University Business School",
        "College of Art, Media and Technology",
        "Faculty of Agriculture",
        "Faculty of Agro-Industry",
        "Faculty of Architecture",
        "Faculty of Associated Medical Sciences",
        "Faculty of Dentistry",
        "Faculty of Economics",
        "Faculty of Education",
        "Faculty of Engineering",
        "Faculty of Fine Arts",
        "Faculty of Humanities",
        "Faculty of Law",
        "Faculty of Mass Communication",
        "Faculty of Medicine",
        "Faculty of Nursing",
        "Faculty of Pharmacy",
        "Faculty of Political Science and Public Administration",
        "Faculty of Science",
        "Faculty of Social Sciences",
        "Faculty of Veterinary Medicine",
        "International College of Digital Innovation"
    ];

    let isSignUpMode = false;

    function load(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
        catch (e) { return fallback; }
    }
    function save(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    async function hashPassword(text) {
        if (window.crypto && crypto.subtle) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
        }
        return btoa(unescape(encodeURIComponent(text)));
    }

    function showMsg(text) { document.getElementById('msg').innerText = text; }

    function togglePassword() {
        const show = document.getElementById('password').type === 'password';
        ['password', 'confirmPassword'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.type = show ? 'text' : 'password';
        });
        document.getElementById('eyeOpen').toggleAttribute('hidden', !show);
        document.getElementById('eyeOff').toggleAttribute('hidden', show);

        const label = show ? 'Hide password' : 'Show password';
        const btn = document.getElementById('eyeBtn');
        btn.title = label;
        btn.setAttribute('aria-label', label);
    }

    if (load(SESSION_KEY, null)) location.replace(FEED_PAGE);

    // Populate faculty dropdown sorted A-Z
    const facultySelect = document.getElementById('faculty');
    FACULTIES.forEach(fac => {
        const opt = document.createElement('option');
        opt.value = fac;
        opt.textContent = fac;
        facultySelect.appendChild(opt);
    });

    function toggleView() {
        isSignUpMode = !isSignUpMode;
        showMsg('');

        const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const facultyGroup = document.getElementById('facultyGroup');
        const facultyInput = document.getElementById('faculty');

        document.getElementById('headerBanner').innerText = isSignUpMode ? 'SIGN UP' : 'LOGIN';
        confirmPasswordGroup.classList.toggle('hidden', !isSignUpMode);
        confirmPasswordInput.required = isSignUpMode;
        
        facultyGroup.classList.toggle('hidden', !isSignUpMode);
        facultyInput.required = isSignUpMode;

        document.getElementById('submitBtn').innerText = isSignUpMode ? 'Create an account' : 'Login';
        document.getElementById('toggleBtn').innerText =
            isSignUpMode ? 'Already have an account?\nLogin' : 'Create a new account';
    }

    async function handleSubmit(event) {
        event.preventDefault();
        showMsg('');

        const username = document.getElementById('username').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const users = load(USERS_KEY, {});

        if (isSignUpMode) {
            const confirmPass = document.getElementById('confirmPassword').value;
            const faculty = document.getElementById('faculty').value;

            if (!username.endsWith('@cmu.ac.th')) return showMsg('Only @cmu.ac.th emails are allowed');
            if (password.length < 6)              return showMsg('Password must be at least 6 characters');
            if (password !== confirmPass)         return showMsg('Passwords do not match');
            if (!faculty)                         return showMsg('Please select your faculty');
            if (users[username])                  return showMsg('This account already exists');

            users[username] = { passHash: await hashPassword(password), faculty };
            save(USERS_KEY, users);

            // Also initialize profile data with selected faculty
            const profileKey = 'cmuh-profile:' + username;
            const existingProfile = load(profileKey, {}); 
            save(profileKey, { ...existingProfile, faculty });
        } else {
            const user = users[username];
            if (!user || user.passHash !== await hashPassword(password)) {
                return showMsg('Incorrect username or password');
            }
            // Ensure profile has faculty if registered previously
            const profileKey = 'cmuh-profile:' + username;
            const existingProfile = load(profileKey, {});
            if (!existingProfile.faculty && user.faculty) {
                save(profileKey, { ...existingProfile, faculty: user.faculty });
            }
        }

        save(SESSION_KEY, { username });
        location.href = FEED_PAGE;
    }
</script>
</body>
</html>
