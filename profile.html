<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    try { if (!JSON.parse(localStorage.getItem('cmuh-session'))) throw 0; }
    catch (e) { location.replace('login.html'); }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profile - MorCor MaChill</title>
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('cmuh-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="logo"><a href="index.html">MorCor<br>MaChill</a></div>

    <form class="search" action="index.html">
      <svg viewBox="0 0 24 24" style="font-size:28px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
      <input name="q" type="search" placeholder="Search posts or #tags">
    </form>

    <aside class="side">
      <a class="post-btn" href="post.html">Post!</a>
      <div class="tags" id="tags"></div>
    </aside>

    <main class="pf">
      <section class="pf-top">
        <div class="cover"></div>

        <div class="pf-menu" id="moreWrap" hidden>
          <button class="dots" id="moreBtn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
          <div class="menu-list" id="moreMenu" hidden>
            <button id="pwdBtn">Change password</button>
            <button class="danger" id="delBtn">Delete profile</button>
          </div>
        </div>

        <div class="pf-ava" id="ava"></div>
        <div class="pf-info">
          <div>
            <h2 id="name"></h2>
            <div class="pf-full" id="full"></div>
            <div class="pf-full" id="facultyInfo" style="margin-top: 4px; font-weight: 600; color: var(--brand);" hidden></div>
          </div>
          <div class="pf-actions">
            <button class="edit" id="friendBtn" hidden>Add friend</button>
            <button class="edit alt" id="declineBtn" hidden>Decline</button>
            <a class="edit alt" id="msgBtn" href="message.html" hidden>Send message</a>
            <button class="edit" id="editBtn" hidden>Edit profile</button>
          </div>
        </div>
        <div class="pf-bio" id="bio"></div>
      </section>

      <section class="stats">
        <div class="stat"><b id="sPosts">0</b><span>Posts</span></div>
        <div class="stat"><b id="sFriends">0</b><span>Friends</span></div>
        <div class="stat"><b id="sJoined">0</b><span>Activities joined</span></div>
      </section>

      <section class="pf-int">
        <h3 id="intTitle">Interests</h3>
        <div class="chips" id="ints"></div>
      </section>

      <section class="pf-int">
        <h3 id="friendsTitle">Friends</h3>
        <div class="chips" id="friendsList"></div>
      </section>

      <section class="pf-int">
        <h3 id="postsTitle">Posts</h3>
        <div class="plist" id="plist"></div>
      </section>
    </main>

    <aside class="right">
      <a class="mid" href="index.html" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      </a>
      <a class="mid" href="favorites.html" title="Favorites">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      </a>
      <a class="mid" id="navProfile" href="profile.html" title="Profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M5.5 19c1.5-3 4-4 6.5-4s5 1 6.5 4"/></svg>
      </a>
      <a class="mid" href="message.html" title="Messages">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
        <span class="badge pip" id="badge" hidden></span>
      </a>
      <a class="mid" href="notifications.html" title="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge" id="notifBadge" hidden></span>
      </a>
      <button class="mid" id="theme" title="Toggle theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      </button>
      <button class="mid" id="logout" title="Log out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </aside>

  </div>

  <dialog id="dlg">
    <b style="font:700 20px 'Gelasio',serif">Edit profile</b>
    <input id="fFull" placeholder="Full name" maxlength="60">
    <textarea id="fBio" placeholder="Short bio" maxlength="200"></textarea>
    <input id="fInt" placeholder="Interests, comma-separated (e.g. running, healthy)" maxlength="120">

    <label class="flabel" for="fPic">
      Profile photo
      <small>Press "Choose File" to pick an image from your device (JPG / PNG)</small>
    </label>
    <input id="fPic" type="file" accept="image/*">
    <button type="button" class="remove-photo" id="removePhoto">Remove photo</button>

    <div class="row">
      <button id="cancel">Cancel</button>
      <button class="go" id="save">Save</button>
    </div>
  </dialog>

  <dialog id="pwdDlg">
    <b style="font:700 20px 'Gelasio',serif">Change password</b>
    <input id="pOld" type="password" placeholder="Current password" autocomplete="current-password">
    <input id="pNew" type="password" placeholder="New password (at least 6 characters)" autocomplete="new-password">
    <input id="pNew2" type="password" placeholder="Confirm new password" autocomplete="new-password">
    <div class="form-error" id="pErr"></div>
    <div class="row">
      <button id="pCancel">Cancel</button>
      <button class="go" id="pSave">Save</button>
    </div>
  </dialog>

  <dialog id="ask" class="ask">
    <h3 id="askTitle"></h3>
    <p id="askText"></p>
    <div class="row">
      <button id="askNo">Cancel</button>
      <button class="go" id="askOk">OK</button>
    </div>
  </dialog>

  <script>
    const POSTS_KEY = 'cmuh-posts2';
    const MESSAGES_KEY = 'cmuh-messages';
    const FRIENDS_KEY = 'cmuh-friends';
    const REQUESTS_KEY = 'cmuh-friend-requests';
    const SESSION_KEY = 'cmuh-session';
    const USERS_KEY = 'cmuh-users';
    const BOOKMARKS_KEY = 'cmuh-bookmarks';
    const NOTIFS_KEY = 'cmuh-notifs';
    const DEFAULT_TAGS = ['#sports', '#running', '#basketball', '#football', '#swimmingwithus'];
    const DEFAULT_AVATAR = 'pic/profile.png';

    const $ = (id) => document.getElementById(id);

    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch (e) { return fallback; }
    }

    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    async function hashPassword(text) {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      }
      return btoa(unescape(encodeURIComponent(text)));
    }

    function esc(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    function ask(title, text, okLabel, danger) {
      return new Promise((resolve) => {
        const dlg = $('ask');
        $('askTitle').textContent = title;
        $('askText').textContent = text;
        $('askOk').textContent = okLabel;
        $('askOk').className = danger ? 'go danger' : 'go';
        const done = (value) => { dlg.close(); resolve(value); };
        $('askOk').onclick = () => done(true);
        $('askNo').onclick = () => done(false);
        dlg.oncancel = () => resolve(false);
        dlg.showModal();
      });
    }

    const user = load(SESSION_KEY, {}).username || 'cmu';
    const ME = user.split('@')[0].toLowerCase();

    function updateBadges() {
      const lastRead = load('cmuh-read:' + ME, {});
      const nMsg = load(MESSAGES_KEY, []).filter((m) => m.to === ME && m.t > (lastRead[m.from] || 0)).length;
      $('badge').hidden = !nMsg;

      const notifs = load(NOTIFS_KEY, []).filter((n) => n.to.toLowerCase() === ME && !n.read);
      $('notifBadge').textContent = notifs.length > 9 ? '9+' : notifs.length;
      $('notifBadge').hidden = !notifs.length;
    }

    const friendsOf = (name) => load(FRIENDS_KEY, {})[name] || [];

    function setFriend(a, b, on) {
      const data = load(FRIENDS_KEY, {});
      [[a, b], [b, a]].forEach(([x, y]) => {
        const list = (data[x] || []).filter((n) => n !== y);
        data[x] = on ? [...list, y] : list;
      });
      save(FRIENDS_KEY, data);
    }

    const viewing = (new URLSearchParams(location.search).get('user') || ME).toLowerCase();
    const isMine = viewing === ME;
    const PROFILE_KEY = 'cmuh-profile:' + (isMine ? user : viewing + '@cmu.ac.th');

    let profile = { full: '', bio: '', interests: [], avatar: '', faculty: '', ...load(PROFILE_KEY, {}) };
    const posts = load(POSTS_KEY, []);
    let removePhoto = false;

    const isViewed = (name) => String(name).toLowerCase() === viewing;

    const requestsList = () => load(REQUESTS_KEY, []);
    const hasSent = () => requestsList().some((r) => r.from === ME && r.to === viewing);
    const hasReceived = () => requestsList().some((r) => r.from === viewing && r.to === ME);

    function sendRequest() {
      const reqId = Date.now();
      const reqs = requestsList();
      reqs.push({ id: reqId, from: ME, to: viewing, t: reqId });
      save(REQUESTS_KEY, reqs);

      const notifs = load(NOTIFS_KEY, []).filter((n) =>
        !(n.type === 'friend_request' && String(n.from).toLowerCase() === ME && String(n.to).toLowerCase() === viewing));

      notifs.unshift({
        id: Date.now(),
        to: viewing,
        from: ME,
        reqId,
        type: 'friend_request',
        text: `${ME} sent you a friend request`,
        t: Date.now(),
        read: false
      });
      save(NOTIFS_KEY, notifs);
    }

    function cancelRequest() {
      save(REQUESTS_KEY, requestsList().filter((r) => !(r.from === ME && r.to === viewing)));
      save(NOTIFS_KEY, load(NOTIFS_KEY, []).filter((n) =>
        !(n.type === 'friend_request' && String(n.from).toLowerCase() === ME && String(n.to).toLowerCase() === viewing)));
    }

    function answerRequest(accept) {
      const req = requestsList().find((r) => r.from === viewing && r.to === ME);
      save(REQUESTS_KEY, requestsList().filter((r) => !(r.from === viewing && r.to === ME)));

      const notifs = load(NOTIFS_KEY, []);
      notifs.forEach((n) => {
        const sameUsers = n.type === 'friend_request'
          && String(n.from).toLowerCase() === viewing
          && String(n.to).toLowerCase() === ME;
        if (sameUsers && (!n.reqId || !req || n.reqId === req.id)) {
          n.status = accept ? 'accepted' : 'declined';
        }
      });

      if (accept) {
        setFriend(ME, viewing, true);
        notifs.unshift({
          id: Date.now(),
          to: viewing,
          from: ME,
          type: 'friend_accept',
          text: `${ME} accepted your friend request`,
          t: Date.now(),
          read: false
        });
      }
      save(NOTIFS_KEY, notifs);
    }

    function postItem(p) {
      return `
        <a class="pitem" href="index.html?post=${p.id}">
          <b>${esc(p.title)}</b>
          <div class="meta">Location: ${esc(p.location)} | Members: ${p.members.length}/${p.max}</div>
          <div class="chips">${p.interest.map((t) => `<span class="chip">#${esc(t)}</span>`).join('')}</div>
        </a>`;
    }

    function drawFriendBtn() {
      const isFriend = friendsOf(ME).includes(viewing);
      const received = hasReceived();
      const sent = hasSent();
      const btn = $('friendBtn');

      if (isFriend) {
        btn.textContent = 'Friends ✓';
        btn.classList.add('alt');
      } else if (received) {
        btn.textContent = 'Accept request';
        btn.classList.remove('alt');
      } else if (sent) {
        btn.textContent = 'Request sent';
        btn.classList.add('alt');
      } else {
        btn.textContent = 'Add friend';
        btn.classList.remove('alt');
      }

      $('declineBtn').hidden = isFriend || !received;
    }

    function draw() {
      const mine = posts.filter((p) => isViewed(p.author));
      const joined = posts.filter((p) => p.members.some(isViewed));
      const displayName = (mine[0] || {}).author || viewing;
      const friends = friendsOf(viewing);

      document.title = `${displayName} - MorCor MaChill`;
      $('ava').innerHTML = profile.avatar
        ? `<img src="${profile.avatar}" alt="Profile photo">`
        : `<img class="default" src="${DEFAULT_AVATAR}" alt="Default profile picture">`;
      $('name').textContent = displayName;
      $('full').textContent = profile.full || (isMine ? user : '');

      if (profile.faculty) {
        $('facultyInfo').textContent = 'Faculty: ' + profile.faculty;
        $('facultyInfo').hidden = false;
      } else {
        $('facultyInfo').hidden = true;
      }

      $('bio').textContent = profile.bio ||
        (isMine ? 'No bio yet. Press "Edit profile" to add one.' : 'No bio yet.');

      $('sPosts').textContent = mine.length;
      $('sFriends').textContent = friends.length;
      $('sJoined').textContent = joined.length;

      $('intTitle').textContent = isMine ? 'Your interests' : 'Interests';
      $('ints').innerHTML = profile.interests && profile.interests.length
        ? profile.interests.map((t) => `<a class="chip" href="index.html?tag=${encodeURIComponent('#' + t)}">#${esc(t)}</a>`).join('')
        : '<span class="time">No interests selected yet</span>';

      $('friendsTitle').textContent = isMine ? 'Your friends' : 'Friends';
      $('friendsList').innerHTML = friends.length
        ? friends.map((n) => `<a class="chip" href="profile.html?user=${encodeURIComponent(n)}">${esc(n)}</a>`).join('')
        : '<span class="time">No friends yet</span>';

      $('postsTitle').textContent = isMine ? 'My posts' : `Posts by ${displayName}`;
      $('plist').innerHTML = mine.length
        ? mine.map(postItem).join('')
        : '<span class="time">No posts yet</span>';

      const tags = new Set(DEFAULT_TAGS);
      posts.forEach((p) => p.interest.forEach((t) => tags.add('#' + t.toLowerCase())));
      $('tags').innerHTML = [...tags].map((t) =>
        `<a class="tag" href="index.html?tag=${encodeURIComponent(t)}">${esc(t)}</a>`
      ).join('');

      if (!isMine) drawFriendBtn();
    }

    $('editBtn').hidden = !isMine;
    $('moreWrap').hidden = !isMine;
    $('friendBtn').hidden = isMine;
    $('msgBtn').hidden = isMine;
    $('msgBtn').href = 'message.html?to=' + encodeURIComponent(viewing);
    $('navProfile').classList.toggle('on', isMine);

    $('friendBtn').onclick = async () => {
      if (friendsOf(ME).includes(viewing)) {
        if (!await ask('Remove friend?', `${viewing} will be removed from your friends.`, 'Remove', true)) return;
        setFriend(ME, viewing, false);
      } else if (hasReceived()) {
        answerRequest(true);
      } else if (hasSent()) {
        if (!await ask('Withdraw request?', `Your friend request to ${viewing} will be withdrawn.`, 'Withdraw', true)) return;
        cancelRequest();
      } else {
        sendRequest();
      }
      draw();
      updateBadges();
    };

    $('declineBtn').onclick = () => {
      answerRequest(false);
      draw();
    };

    $('moreBtn').onclick = (e) => {
      e.stopPropagation();
      $('moreMenu').hidden = !$('moreMenu').hidden;
    };

    document.addEventListener('click', () => { $('moreMenu').hidden = true; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('moreMenu').hidden = true; });

    function resizeImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const size = 240;
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;

            const scale = Math.max(size / img.width, size / img.height);
            const w = img.width * scale;
            const h = img.height * scale;

            canvas.getContext('2d').drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    $('editBtn').onclick = () => {
      $('fFull').value = profile.full;
      $('fBio').value = profile.bio;
      $('fInt').value = profile.interests.join(', ');
      $('fPic').value = '';

      removePhoto = false;
      $('removePhoto').hidden = !profile.avatar;
      $('removePhoto').disabled = false;
      $('removePhoto').textContent = 'Remove photo';

      $('dlg').showModal();
    };

    $('removePhoto').onclick = () => {
      removePhoto = true;
      $('fPic').value = '';
      $('removePhoto').disabled = true;
      $('removePhoto').textContent = 'Photo will be removed when you save';
    };

    $('cancel').onclick = () => $('dlg').close();

    $('save').onclick = async () => {
      profile.full = $('fFull').value.trim();
      profile.bio = $('fBio').value.trim();
      profile.interests = $('fInt').value
        .split(/[,\s]+/)
        .map((t) => t.replace(/^#+/, '').trim())
        .filter(Boolean);

      const file = $('fPic').files[0];
      if (file) profile.avatar = await resizeImage(file);
      else if (removePhoto) profile.avatar = '';

      save(PROFILE_KEY, profile);
      $('dlg').close();
      draw();
    };

    $('pwdBtn').onclick = () => {
      ['pOld', 'pNew', 'pNew2'].forEach((id) => { $(id).value = ''; });
      $('pErr').textContent = '';
      $('pwdDlg').showModal();
    };

    $('pCancel').onclick = () => $('pwdDlg').close();

    $('pSave').onclick = async () => {
      const oldPass = $('pOld').value;
      const newPass = $('pNew').value;
      const newPass2 = $('pNew2').value;
      const fail = (msg) => { $('pErr').textContent = msg; };

      const users = load(USERS_KEY, {});
      const account = users[user];

      if (!account) return fail('Account not found. Please log in again.');
      if (account.passHash !== await hashPassword(oldPass)) return fail('Current password is incorrect');
      if (newPass.length < 6) return fail('New password must be at least 6 characters');
      if (newPass === oldPass) return fail('New password must be different from the current one');
      if (newPass !== newPass2) return fail('New passwords do not match');

      account.passHash = await hashPassword(newPass);
      save(USERS_KEY, users);
      $('pwdDlg').close();
      alert('Password changed successfully.');
    };

    function deleteProfile() {
      const lower = (s) => String(s).toLowerCase();

      const users = load(USERS_KEY, {});
      delete users[user];
      save(USERS_KEY, users);

      save(POSTS_KEY, load(POSTS_KEY, [])
        .filter((p) => lower(p.author) !== ME)
        .map((p) => ({
          ...p,
          members: p.members.filter((m) => lower(m) !== ME),
          comments: p.comments.filter((c) => lower(c.name) !== ME)
        })));

      save(MESSAGES_KEY, load(MESSAGES_KEY, []).filter((m) => m.from !== ME && m.to !== ME));

      const friends = load(FRIENDS_KEY, {});
      delete friends[ME];
      Object.keys(friends).forEach((k) => { friends[k] = friends[k].filter((n) => n !== ME); });
      save(FRIENDS_KEY, friends);

      save(REQUESTS_KEY, requestsList().filter((r) => r.from !== ME && r.to !== ME));
      save(NOTIFS_KEY, load(NOTIFS_KEY, []).filter((n) => lower(n.to) !== ME && lower(n.from || '') !== ME));

      const bms = load(BOOKMARKS_KEY, {});
      delete bms[ME];
      save(BOOKMARKS_KEY, bms);

      ['cmuh-profile:' + user, 'cmuh-read:' + ME, SESSION_KEY].forEach((k) => {
        try { localStorage.removeItem(k); } catch (e) {}
      });

      location.replace('login.html');
    }

    $('delBtn').onclick = async () => {
      const ok = await ask(
        'Delete your profile?',
        'Your account, posts, messages and friends will be removed permanently. This cannot be undone.',
        'Delete profile',
        true
      );
      if (ok) deleteProfile();
    };

    $('theme').onclick = () => {
      const root = document.documentElement;
      const isDark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#1b1818';
      const next = isDark ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('cmuh-theme', next); } catch (e) {}
    };

    $('logout').onclick = async () => {
      if (!await ask('Log out?', 'You will need to log in again to use MorCor MaChill.', 'Log out')) return;
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      location.replace('login.html');
    };

    window.addEventListener('storage', (e) => {
      if (e.key === MESSAGES_KEY || e.key === NOTIFS_KEY) updateBadges();
      if (e.key === FRIENDS_KEY || e.key === REQUESTS_KEY) draw();
    });

    draw();
    updateBadges();
  </script>
</body>
</html>
