  <meta charset="UTF-8">
  <script>
    try { if (!JSON.parse(localStorage.getItem('cmuh-session'))) throw 0; }
    catch (e) { location.replace('login.html'); }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MorCor MaChill</title>
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('cmuh-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="logo"><a href="index.html">MorCor<br>MaChill</a></div>

    <label class="search">
      <svg viewBox="0 0 24 24" style="font-size:28px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>

    <aside class="side">
      <a class="post-btn" href="post.html">Post!</a>
      <div class="tags" id="tags"></div>

    <main class="feed" id="feed"></main>

    <aside class="right">
      <a class="mid on" href="index.html" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      </a>
      <a class="mid" href="favorites.html" title="Favorites">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      </a>
      <a class="mid" href="profile.html" title="Profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M5.5 19c1.5-3 4-4 6.5-4s5 1 6.5 4"/></svg>
      </a>
      <a class="mid" href="message.html" title="Messages">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
        <span class="badge pip" id="badge" hidden></span>
      </a>
      <a class="mid" href="notifications.html" title="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge" id="notifBadge" hidden></span>
      </a>
      <button class="mid" id="theme" title="Toggle theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      </button>
      <button class="mid" id="logout" title="Log out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </aside>

  </div>

  <dialog id="view"></dialog>

  <dialog id="ask" class="ask">
    <h3 id="askTitle"></h3>
    <p id="askText"></p>
    <div class="row">
      <button id="askNo">Cancel</button>
      <button class="go" id="askOk">OK</button>
    </div>
  </dialog>

  <script>
    const POSTS_KEY = 'cmuh-posts2';
    const SESSION_KEY = 'cmuh-session';
    const MESSAGES_KEY = 'cmuh-messages';
    const BOOKMARKS_KEY = 'cmuh-bookmarks';
    const NOTIFS_KEY = 'cmuh-notifs';
    const DEFAULT_TAGS = ['#sports', '#running', '#basketball', '#football', '#swimmingwithus'];
    const DEFAULT_AVATAR = 'pic/profile.png';

    const sessionUser = load(SESSION_KEY, {}).username || 'CMU';
    const ME = sessionUser.split('@')[0].toLowerCase();
    const PROFILE_KEY = 'cmuh-profile:' + sessionUser;

    const $ = (id) => document.getElementById(id);

    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch (e) { return fallback; }
    }

    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    function esc(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    function timeAgo(time) {
      const min = Math.floor((Date.now() - time) / 60000);
      if (min < 1) return 'just now';
      if (min < 60) return `${min} min ago`;
      const hr = Math.floor(min / 60);
      return hr < 24 ? `${hr} h ago` : `${Math.floor(hr / 24)} d ago`;
    }

    function ask(title, text, okLabel, danger) {
      return new Promise((resolve) => {
        const dlg = $('ask');
        $('askTitle').textContent = title;
        $('askText').textContent = text;
        $('askOk').textContent = okLabel;
        $('askOk').className = danger ? 'go danger' : 'go';
        const done = (value) => { dlg.close(); resolve(value); };
        $('askOk').onclick = () => done(true);
        $('askNo').onclick = () => done(false);
        dlg.oncancel = () => resolve(false);
        dlg.showModal();
      });
    }

    function avatarHtml(name) {
      const profile = load('cmuh-profile:' + String(name).toLowerCase() + '@cmu.ac.th', {});
      return profile.avatar
        ? `<img src="${profile.avatar}" alt="">`
        : `<img class="default" src="${DEFAULT_AVATAR}" alt="">`;
    }

    function updateBadges() {
      const lastReadMsg = load('cmuh-read:' + ME, {});
      const nMsg = load(MESSAGES_KEY, []).filter((m) => m.to === ME && m.t > (lastReadMsg[m.from] || 0)).length;
      $('badge').hidden = !nMsg;

      const notifs = load(NOTIFS_KEY, []).filter((n) => n.to.toLowerCase() === ME && !n.read);
      $('notifBadge').textContent = notifs.length > 9 ? '9+' : notifs.length;
      $('notifBadge').hidden = !notifs.length;
    }

    let posts = load(POSTS_KEY, [{
      id: 1,
      author: 'Mint',
      title: 'GO JOGGING',
      location: 'Huay Kaew Reservoir, Chiang Mai',
      max: 11,
      interest: ['running', 'healthy', 'meeting'],
      details: "Let's go jogging together......",
      t: Date.now() - 3600000,
      members: ['Mint', 'Ton', 'Fah'],
      pending: [],
      comments: []
    }]);

    let activeTag = null;
    let currentId = null;
    let replyingTo = null;

    const savePosts = () => save(POSTS_KEY, posts);

    if (localStorage.getItem(POSTS_KEY) === null) savePosts();

    function getBookmarks() {
      return load(BOOKMARKS_KEY, {})[ME] || [];
    }

    function toggleBookmark(postId, e) {
      e.stopPropagation();
      const bms = load(BOOKMARKS_KEY, {});
      let userBms = bms[ME] || [];
      if (userBms.includes(postId)) {
        userBms = userBms.filter((id) => id !== postId);
      } else {
        userBms.push(postId);
      }
      bms[ME] = userBms;
      save(BOOKMARKS_KEY, bms);
      savePosts();
      render();
      if ($('view').open) drawView();
    }

    function toggleInterestFavorite(tagText) {
      let profile = load(PROFILE_KEY, { full: '', bio: '', interests: [], avatar: '', faculty: '' });
      if (!profile.interests) profile.interests = [];

      const cleanTag = tagText.replace(/^#/, '').toLowerCase();
      if (profile.interests.map((t) => t.toLowerCase()).includes(cleanTag)) {
        profile.interests = profile.interests.filter((t) => t.toLowerCase() !== cleanTag);
      } else {
        profile.interests.push(cleanTag);
      }
      save(PROFILE_KEY, profile);
      render();
    }

    function chipsHtml(post) {
      return post.interest.map((t) => `<span class="chip">#${esc(t)}</span>`).join('');
    }

    function postCard(p) {
      const isFull = p.members.length >= p.max;
      const statusBadge = isFull
        ? '<span class="status-badge full">FULL</span>'
        : '<span class="status-badge open">OPEN</span>';

      const isOwn = p.author.toLowerCase() === ME;
      const isBookmarked = getBookmarks().includes(p.id);
      const starBtn = isOwn ? '' : `
          <button class="bookmark-btn ${isBookmarked ? 'saved' : ''}" onclick="toggleBookmark(${p.id}, event)" title="${isBookmarked ? 'Remove from favorites' : 'Add to favorites'}">${isBookmarked ? '★' : '☆'}</button>`;

      return `
        <article class="post" data-id="${p.id}">${starBtn}
          <a class="head author-link" href="profile.html?user=${encodeURIComponent(p.author)}" title="View ${esc(p.author)}'s profile">
            <span class="avatar">${avatarHtml(p.author)}</span>
            <div>
              <div class="name">${esc(p.author)}</div>
              <div class="time">${timeAgo(p.t)}</div>
            </div>
          </a>
          <h3>${esc(p.title)} ${statusBadge}</h3>
          <div class="meta">Location: ${esc(p.location)} | Members: ${p.members.length}/${p.max}</div>
          <div class="chips">${chipsHtml(p)}</div>
        </article>`;
    }

    function renderTags() {
      const tags = new Set(DEFAULT_TAGS);
      posts.forEach((p) => p.interest.forEach((t) => tags.add('#' + t.toLowerCase())));

      $('tags').innerHTML = [...tags].map((t) =>
        `<button class="tag ${t === activeTag ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`
      ).join('');
    }

    function render() {
      const query = $('q').value.trim().toLowerCase();

      const list = posts.filter((p) => {
        const tagOk = !activeTag || p.interest.some((t) => '#' + t.toLowerCase() === activeTag);
        const text = (p.title + p.details + p.location + p.author + p.interest.join(' ')).toLowerCase();
        return tagOk && (!query || text.includes(query));
      });

      let headerHtml = '';
      if (activeTag) {
        const profile = load(PROFILE_KEY, { interests: [] });
        const isFav = (profile.interests || []).map((t) => t.toLowerCase()).includes(activeTag.replace(/^#/, '').toLowerCase());
        headerHtml = `
          <div class="tag-header">
            <h2 class="tag-title">${esc(activeTag)}</h2>
            <button class="interest-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleInterestFavorite('${esc(activeTag)}')" title="Save interest">♥</button>
          </div>
        `;
      }

      $('feed').innerHTML = headerHtml + (list.length
        ? list.map(postCard).join('')
        : '<div class="empty">No posts match your search</div>');

      renderTags();
    }

    function drawView() {
      const p = posts.find((x) => x.id === currentId);
      if (!p) return;

      if (!p.members) p.members = [p.author];
      if (!p.pending) p.pending = [];
      if (!p.comments) p.comments = [];

      const isOwner = p.author.toLowerCase() === ME;
      const joined = p.members.map((m) => m.toLowerCase()).includes(ME);
      const pending = p.pending.map((m) => m.toLowerCase()).includes(ME);
      const full = p.members.length >= p.max;

      let joinLabel = 'JOIN';
      if (joined) joinLabel = 'LEAVE';
      else if (pending) joinLabel = 'PENDING APPROVAL';
      else if (full) joinLabel = 'FULL';

      const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(p.location)}&output=embed`;
      const directMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.location)}`;

      const isBookmarked = getBookmarks().includes(p.id);
      const favBtn = isOwner ? '' : `<button class="join fav-toggle" onclick="toggleBookmark(${p.id}, event)">${isBookmarked ? '★ Favorited' : '☆ Favorite'}</button>`;

      let pendingBoxHtml = '';
      if (isOwner && p.pending.length > 0) {
        pendingBoxHtml = `
          <h4 style="color:#e65100;">Pending Join Requests</h4>
          <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
            ${p.pending.map((user) => `
              <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bar); padding:8px 12px; border-radius:10px;">
                <a href="profile.html?user=${encodeURIComponent(user)}" target="_blank" style="color:inherit; text-decoration:none; font-weight:600; display:flex; align-items:center; gap:6px;">
                  <span style="width:24px;height:24px;border-radius:50%;overflow:hidden;display:inline-block;"><img src="${avatarHtml(user).match(/src="([^"]*)"/)?.[1] || DEFAULT_AVATAR}" style="width:100%;height:100%;object-fit:cover;"></span>
                  <span>${esc(user)} ↗</span>
                </a>
                <div style="display:flex; gap:6px;">
                  <button class="join" style="padding:4px 10px; font-size:14px; background:#2e7d32;" onclick="handleRequest(${p.id}, '${esc(user)}', true)">Accept</button>
                  <button class="join" style="padding:4px 10px; font-size:14px; background:#c62828;" onclick="handleRequest(${p.id}, '${esc(user)}', false)">Reject</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      const mainComments = p.comments.filter((c) => !c.parentId);
      const renderCommentItem = (c) => {
        const replies = p.comments.filter((r) => r.parentId === c.id);
        return `
          <div class="cmt-box">
            <div class="cmt-main">
              <div><b>${esc(c.name)}</b>${esc(c.text)}</div>
              <button style="background:none; border:0; color:var(--muted); font-size:12px; cursor:pointer; padding:4px 0 0;" onclick="setReply(${c.id})">Reply</button>
            </div>
            ${replies.length > 0 ? `
              <div class="cmt-replies">
                ${replies.map((r) => `
                  <div class="cmt-reply">
                    <div><b>${esc(r.name)}</b>${esc(r.text)}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>`;
      };

      const placeholderText = replyingTo ? 'Replying to comment... (Press Enter)' : 'Write a comment and press Enter';

      $('view').innerHTML = `
        <div class="detail">
          <div class="top">
            <div>
              <h2>${esc(p.title)}</h2>
              <h4 style="margin-top:10px">Members (${p.members.length}/${p.max})</h4>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
              ${favBtn}
              <button class="join ${joined || pending ? 'on' : ''}" id="join" ${(full && !joined && !pending) || (pending && !isOwner) ? 'disabled' : ''}>${joinLabel}</button>
            </div>
          </div>

          <div class="time">by <a class="author-link" href="profile.html?user=${encodeURIComponent(p.author)}">${esc(p.author)}</a></div>
          <p style="margin:8px 0">${esc(p.details)}</p>
          <div class="chips">${chipsHtml(p)}</div>

          ${pendingBoxHtml}

          <h4>Location <a href="${directMapUrl}" target="_blank" style="font-size:13px; font-weight:normal; margin-left:10px; color:var(--brand);">Open in Google Maps ↗</a></h4>
          <div class="time" style="margin-bottom:6px">Location: ${esc(p.location)}</div>
          <iframe loading="lazy" src="${mapUrl}"></iframe>

          <h4>Comment</h4>
          ${mainComments.map(renderCommentItem).join('')}
          ${replyingTo ? `<div style="font-size:12px; color:var(--muted); margin-bottom:4px;">Replying to comment <button style="background:none; border:0; color:var(--brand); cursor:pointer;" onclick="cancelReply()">Cancel</button></div>` : ''}
          <input id="cin" placeholder="${placeholderText}" maxlength="300">

          <div class="row">
            ${isOwner ? '<button id="del" class="del">Delete post</button>' : ''}
            <button id="close">Close</button>
          </div>
        </div>`;
    }

    window.setReply = function (commentId) {
      replyingTo = commentId;
      drawView();
      $('cin').focus();
    };

    window.cancelReply = function () {
      replyingTo = null;
      drawView();
    };

    window.handleRequest = function (postId, applicant, accept) {
      const p = posts.find((x) => x.id === postId);
      if (!p) return;
      p.pending = p.pending.filter((u) => u.toLowerCase() !== applicant.toLowerCase());
      if (accept && !p.members.map((m) => m.toLowerCase()).includes(applicant.toLowerCase())) {
        p.members.push(applicant);
      }
      savePosts();

      const notifs = load(NOTIFS_KEY, []);
      notifs.unshift({
        id: Date.now(),
        to: applicant,
        text: accept ? `Your request to join "${p.title}" was accepted!` : `Your request to join "${p.title}" was rejected.`,
        t: Date.now(),
        read: false
      });
      save(NOTIFS_KEY, notifs);

      drawView();
      render();
    };

    $('feed').addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('button.bookmark-btn') || e.target.closest('button.interest-fav-btn')) return;
      const card = e.target.closest('.post');
      if (!card) return;
      currentId = Number(card.dataset.id);
      replyingTo = null;
      drawView();
      $('view').showModal();
    });

    $('tags').addEventListener('click', (e) => {
      const btn = e.target.closest('.tag');
      if (!btn) return;
      activeTag = activeTag === btn.dataset.t ? null : btn.dataset.t;
      render();
    });

    $('view').addEventListener('click', async (e) => {
      const p = posts.find((x) => x.id === currentId);

      if (e.target.id === 'close' || e.target === $('view')) {
        $('view').close();
        return;
      }

      if (e.target.id === 'del' && p && p.author.toLowerCase() === ME) {
        if (!await ask('Delete this post?', 'This post will be removed permanently.', 'Delete', true)) return;
        posts = posts.filter((x) => x.id !== p.id);
        savePosts();
        $('view').close();
        render();
        return;
      }

      if (e.target.id === 'join' && p) {
        if (!p.members) p.members = [p.author];
        if (!p.pending) p.pending = [];

        const isMember = p.members.map((m) => m.toLowerCase()).includes(ME);
        const isPending = p.pending.map((m) => m.toLowerCase()).includes(ME);

        if (isMember) {
          if (p.author.toLowerCase() === ME) {
            alert('Owner cannot leave the activity.');
            return;
          }
          p.members = p.members.filter((m) => m.toLowerCase() !== ME);
        } else if (isPending) {
          p.pending = p.pending.filter((m) => m.toLowerCase() !== ME);
        } else {
          p.pending.push(ME);
          const notifs = load(NOTIFS_KEY, []);
          notifs.unshift({
            id: Date.now(),
            to: p.author,
            text: `${ME} wants to join your activity "${p.title}"`,
            t: Date.now(),
            read: false
          });
          save(NOTIFS_KEY, notifs);
        }
        savePosts();
        drawView();
        render();
      }
    });

    $('view').addEventListener('keydown', (e) => {
      if (e.target.id !== 'cin' || e.key !== 'Enter') return;

      const text = e.target.value.trim();
      const p = posts.find((x) => x.id === currentId);
      if (!text || !p) return;

      if (!p.comments) p.comments = [];
      p.comments.push({ id: Date.now(), parentId: replyingTo, name: ME, text, t: Date.now() });

      const notifs = load(NOTIFS_KEY, []);
      let targetUser = p.author;
      if (replyingTo) {
        const parentCmt = p.comments.find((c) => c.id === replyingTo);
        if (parentCmt) targetUser = parentCmt.name;
      }

      if (targetUser.toLowerCase() !== ME) {
        notifs.unshift({
          id: Date.now(),
          to: targetUser,
          text: `${ME} replied to your comment in "${p.title}"`,
          t: Date.now(),
          read: false
        });
        save(NOTIFS_KEY, notifs);
      }

      replyingTo = null;
      savePosts();
      drawView();
      $('cin').focus();
    });

    $('q').addEventListener('input', render);

    $('theme').onclick = () => {
      const root = document.documentElement;
      const isDark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#1b1818';
      const next = isDark ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('cmuh-theme', next); } catch (e) {}
    };

    $('logout').onclick = async () => {
      if (!await ask('Log out?', 'You will need to log in again to use MorCor MaChill.', 'Log out')) return;
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      location.replace('login.html');
    };

    const params = new URLSearchParams(location.search);
    activeTag = params.get('tag');
    $('q').value = params.get('q') || '';

    render();
    updateBadges();

    const openId = Number(params.get('post'));
    if (openId && posts.some((p) => p.id === openId)) {
      currentId = openId;
      drawView();
      $('view').showModal();
    }

    window.addEventListener('storage', (e) => {
      if (e.key === MESSAGES_KEY || e.key === NOTIFS_KEY) updateBadges();
    });
  </script>
</body>

  <meta charset="UTF-8">

  </script>

  </script>
  <link rel="stylesheet" href="style.css">

      vertical-align: middle;
    }
    .status-badge.open { background: #2e7d32; color: #fff; }

      color: var(--muted);
    }

    .cmt-main { padding: 10px 14px; background: var(--bar); border-radius: 14px; font-size: 14px; }
    .cmt-replies { margin-left: 20px; margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
    .cmt-reply { padding: 8px 12px; background: var(--field); border-radius: 12px; font-size: 13px; }
    .tag-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 20px 24px; 
      background: var(--card); 
      border-radius: 20px; 
      margin-bottom: 16px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .tag-title { font: 700 28px 'Gelasio', serif; margin: 0; color: var(--ink); }
    .interest-fav-btn { 
      background: var(--bar); 
      border: 0; 
      cursor: pointer; 
      font-size: 22px; 
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted); 
      transition: all 0.2s; 
    }
    .interest-fav-btn:hover { transform: scale(1.1); background: var(--field); }
    .interest-fav-btn.saved { color: #e91e63; background: rgba(233, 30, 99, 0.1); }
  </style>
</head>
<body>
  <div class="app">

    <div class="logo"><a href="index.html">MorCor<br>MaChill</a></div>

    <label class="search">
      <svg viewBox="0 0 24 24" style="font-size:28px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
      <input id="q" type="search" placeholder="Search posts or #tags">
    </label>

    <aside class="side">
      <a class="post-btn" href="post.html">Post!</a>
      <div class="tags" id="tags"></div>
    </aside>

    <main class="feed" id="feed"></main>

    <aside class="right">
      <a class="mid on" href="index.html" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      </a>
      <a class="mid" href="profile.html" title="Profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M5.5 19c1.5-3 4-4 6.5-4s5 1 6.5 4"/></svg>
      </a>
      <a class="mid" href="message.html" title="Messages">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
        <span class="badge" id="badge" hidden></span>
      </a>
      <a class="mid" href="notifications.html" title="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge" id="notifBadge" hidden></span>
      </a>
      <button class="mid" id="theme" title="Toggle theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      </button>
      <button class="mid" id="logout" title="Log out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </aside>

  </div>

  <dialog id="view"></dialog>

  <dialog id="ask" class="ask">
    <h3 id="askTitle"></h3>
    <p id="askText"></p>
    <div class="row">
      <button id="askNo">Cancel</button>
      <button class="go" id="askOk">OK</button>
    </div>
  </dialog>

  <script>
    const POSTS_KEY = 'cmuh-posts2';
    const SESSION_KEY = 'cmuh-session';
    const MESSAGES_KEY = 'cmuh-messages';
    const BOOKMARKS_KEY = 'cmuh-bookmarks';
    const NOTIFS_KEY = 'cmuh-notifs';
    const DEFAULT_TAGS = ['#sports', '#running', '#basketball', '#football', '#swimmingwithus'];
    const DEFAULT_AVATAR = 'pic/profile.png';

    const sessionUser = load(SESSION_KEY, {}).username || 'CMU';
    const ME = sessionUser.split('@')[0].toLowerCase();
    const PROFILE_KEY = 'cmuh-profile:' + sessionUser;

    const $ = (id) => document.getElementById(id);

    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch (e) { return fallback; }
    }

    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    function esc(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    function timeAgo(time) {
      const min = Math.floor((Date.now() - time) / 60000);
      if (min < 1) return 'just now';
      if (min < 60) return `${min} min ago`;
      const hr = Math.floor(min / 60);
      return hr < 24 ? `${hr} h ago` : `${Math.floor(hr / 24)} d ago`;
    }

    function ask(title, text, okLabel, danger) {
      return new Promise((resolve) => {
        const dlg = $('ask');$('askTitle').textContent = title;
        $('askText').textContent = text;
        $('askOk').textContent = okLabel;
        $('askOk').className = danger ? 'go danger' : 'go';
        const done = (value) => { dlg.close(); resolve(value); };
        $('askOk').onclick = () => done(true);$('askNo').onclick = () => done(false);
        dlg.oncancel = () => resolve(false);
        dlg.showModal();
      });
    }

    function avatarHtml(name) {
      const profile = load('cmuh-profile:' + String(name).toLowerCase() + '@cmu.ac.th', {});
      return profile.avatar
        ? `<img src="${profile.avatar}" alt="">`
        : `<img class="default" src="${DEFAULT_AVATAR}" alt="">`;
    }

    function updateBadges() {
      const lastReadMsg = load('cmuh-read:' + ME, {});
      const nMsg = load(MESSAGES_KEY, []).filter((m) => m.to === ME && m.t > (lastReadMsg[m.from] || 0)).length;
      $('badge').textContent = nMsg > 9 ? '9+' : nMsg;
      $('badge').hidden = !nMsg;

      const notifs = load(NOTIFS_KEY, []).filter(n => n.to.toLowerCase() === ME && !n.read);
      $('notifBadge').textContent = notifs.length > 9 ? '9+' : notifs.length;
      $('notifBadge').hidden = !notifs.length;
    }

    let posts = load(POSTS_KEY, [{
      id: 1,
      author: 'Mint',
      title: 'GO JOGGING',
      location: 'Huay Kaew Reservoir, Chiang Mai',
      max: 11,
      interest: ['running', 'healthy', 'meeting'],
      details: "Let's go jogging together......",
      t: Date.now() - 3600000,
      members: ['Mint', 'Ton', 'Fah'],
      pending: [],
      comments: []
    }]);

    let activeTag = null;
    let currentId = null;
    let replyingTo = null;

    const savePosts = () => save(POSTS_KEY, posts);

    function getBookmarks() {
      const bms = load(BOOKMARKS_KEY, {});
      return bms[ME] || [];
    }

    function toggleBookmark(postId, e) {
      e.stopPropagation();
      const bms = load(BOOKMARKS_KEY, {});
      let userBms = bms[ME] || [];
      if (userBms.includes(postId)) {
        userBms = userBms.filter(id => id !== postId);
      } else {
        userBms.push(postId);
      }
      bms[ME] = userBms;
      save(BOOKMARKS_KEY, bms);
      render();
      if ($('view').open) drawView();
    }

    function toggleInterestFavorite(tagText) {
      let profile = load(PROFILE_KEY, { full: '', bio: '', interests: [], avatar: '', faculty: '' });
      if (!profile.interests) profile.interests = [];
      
      const cleanTag = tagText.replace(/^#/, '').toLowerCase();
      if (profile.interests.map(t => t.toLowerCase()).includes(cleanTag)) {
        profile.interests = profile.interests.filter(t => t.toLowerCase() !== cleanTag);
      } else {
        profile.interests.push(cleanTag);
      }
      save(PROFILE_KEY, profile);
      render();
    }

    function chipsHtml(post) {
      return post.interest.map((t) => `<span class="chip">#${esc(t)}</span>`).join('');
    }

    function postCard(p) {
      const isFull = p.members.length >= p.max;
      const statusBadge = isFull 
        ? '<span class="status-badge full">FULL</span>' 
        : '<span class="status-badge open">OPEN</span>';
      
      const userBms = getBookmarks();
      const isBookmarked = userBms.includes(p.id);
      const bmClass = isBookmarked ? 'bookmark-btn saved' : 'bookmark-btn';
      const bmIcon = isBookmarked ? '★' : '☆';

      return `
        <article class="post" data-id="${p.id}">
          <button class="${bmClass}" onclick="toggleBookmark(${p.id}, event)" title="Bookmark post">${bmIcon}</button>
          <a class="head author-link" href="profile.html?user=${encodeURIComponent(p.author)}" title="View ${esc(p.author)}'s profile">
            <span class="avatar">${avatarHtml(p.author)}</span>
            <div>
              <div class="name">${esc(p.author)}</div>
              <div class="time">${timeAgo(p.t)}</div>
            </div>
          </a>
          <h3>${esc(p.title)} ${statusBadge}</h3>
          <div class="meta">Location: ${esc(p.location)} | Members: ${p.members.length}/${p.max}</div>
          <div class="chips">${chipsHtml(p)}</div>
        </article>`;
    }

    function renderTags() {
      const tags = new Set(DEFAULT_TAGS);
      posts.forEach((p) => p.interest.forEach((t) => tags.add('#' + t.toLowerCase())));

      $('tags').innerHTML = [...tags].map((t) =>
        `<button class="tag ${t === activeTag ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`
      ).join('');
    }

    function render() {
      const query = $('q').value.trim().toLowerCase();

      const list = posts.filter((p) => {
        const tagOk = !activeTag || p.interest.some((t) => '#' + t.toLowerCase() === activeTag);
        const text = (p.title + p.details + p.location + p.author + p.interest.join(' ')).toLowerCase();
        return tagOk && (!query || text.includes(query));
      });

      let headerHtml = '';
      if (activeTag) {
        let profile = load(PROFILE_KEY, { interests: [] });
        let isFav = (profile.interests || []).map(t => t.toLowerCase()).includes(activeTag.replace(/^#/, '').toLowerCase());
        headerHtml = `
          <div class="tag-header">
            <h2 class="tag-title">${esc(activeTag)}</h2>
            <button class="interest-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleInterestFavorite('${esc(activeTag)}')" title="Save interest">♥</button>
          </div>
        `;
      }

      $('feed').innerHTML = headerHtml + (list.length
        ? list.map(postCard).join('')
        : '<div class="empty">No posts match your search</div>');

      renderTags();
    }

    function drawView() {
      const p = posts.find((x) => x.id === currentId);
      if (!p) return;

      if (!p.members) p.members = [p.author];
      if (!p.pending) p.pending = [];
      if (!p.comments) p.comments = [];

      const isOwner = p.author.toLowerCase() === ME;
      const joined = p.members.map(m => m.toLowerCase()).includes(ME);
      const pending = p.pending.map(m => m.toLowerCase()).includes(ME);
      const full = p.members.length >= p.max;

      let joinLabel = 'JOIN';
      if (joined) joinLabel = 'LEAVE';
      else if (pending) joinLabel = 'PENDING APPROVAL';
      else if (full) joinLabel = 'FULL';

      const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(p.location)}&output=embed`;
      const directMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.location)}`;

      const userBms = getBookmarks();
      const isBookmarked = userBms.includes(p.id);

      let pendingBoxHtml = '';
      if (isOwner && p.pending && p.pending.length > 0) {
        pendingBoxHtml = `
          <h4 style="color:#e65100;">Pending Join Requests</h4>
          <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
            ${p.pending.map(user => `
              <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bar); padding:8px 12px; border-radius:10px;">
                <a href="profile.html?user=${encodeURIComponent(user)}" target="_blank" style="color:inherit; text-decoration:none; font-weight:600; display:flex; align-items:center; gap:6px;">
                  <span style="width:24px;height:24px;border-radius:50%;overflow:hidden;display:inline-block;"><img src="${avatarHtml(user).match(/src="([^"]*)"/)?.[1] || DEFAULT_AVATAR}" style="width:100%;height:100%;object-fit:cover;"></span>
                  <span>${esc(user)} ↗</span>
                </a>
                <div style="display:flex; gap:6px;">
                  <button class="join" style="padding:4px 10px; font-size:14px; background:#2e7d32;" onclick="handleRequest(${p.id}, '${esc(user)}', true)">Accept</button>
                  <button class="join" style="padding:4px 10px; font-size:14px; background:#c62828;" onclick="handleRequest(${p.id}, '${esc(user)}', false)">Reject</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      const mainComments = p.comments.filter(c => !c.parentId);
      const renderCommentItem = (c) => {
        const replies = p.comments.filter(r => r.parentId === c.id);
        return `
          <div class="cmt-box">
            <div class="cmt-main">
              <div><b>${esc(c.name)}</b>${esc(c.text)}</div>
              <button style="background:none; border:0; color:var(--muted); font-size:12px; cursor:pointer; padding:4px 0 0;" onclick="setReply(${c.id})">Reply</button>
            </div>
            ${replies.length > 0 ? `
              <div class="cmt-replies">
                ${replies.map(r => `
                  <div class="cmt-reply">
                    <div><b>${esc(r.name)}</b>${esc(r.text)}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>`;
      };

      const placeholderText = replyingTo ? `Replying to comment... (Press Enter)` : `Write a comment and press Enter`;

      $('view').innerHTML = `
        <div class="detail">
          <div class="top">
            <div>
              <h2>${esc(p.title)}</h2>
              <h4 style="margin-top:10px">Members (${p.members.length}/${p.max})</h4>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
              <button class="join" onclick="toggleBookmark(${p.id}, event); drawView();" style="background:var(--chip); color:var(--ink); padding:10px 14px;">${isBookmarked ? 'Saved' : 'Save'}</button>
              <button class="join ${joined || pending ? 'on' : ''}" id="join" ${(full && !joined && !pending) || (pending && !isOwner) ? 'disabled' : ''}>${joinLabel}</button>
            </div>
          </div>

          <div class="time">by <a class="author-link" href="profile.html?user=${encodeURIComponent(p.author)}">${esc(p.author)}</a></div>
          <p style="margin:8px 0">${esc(p.details)}</p>
          <div class="chips">${chipsHtml(p)}</div>

          ${pendingBoxHtml}

          <h4>Location <a href="${directMapUrl}" target="_blank" style="font-size:13px; font-weight:normal; margin-left:10px; color:var(--brand);">Open in Google Maps ↗</a></h4>
          <div class="time" style="margin-bottom:6px">Location: ${esc(p.location)}</div>
          <iframe loading="lazy" src="${mapUrl}"></iframe>

          <h4>Comment</h4>
          ${mainComments.map(renderCommentItem).join('')}
          ${replyingTo ? `<div style="font-size:12px; color:var(--muted); margin-bottom:4px;">Replying to comment <button style="background:none; border:0; color:var(--brand); cursor:pointer;" onclick="cancelReply()">Cancel</button></div>` : ''}
          <input id="cin" placeholder="${placeholderText}" maxlength="300">

          <div class="row">
            ${isOwner ? '<button id="del" class="del">Delete post</button>' : ''}
            <button id="close">Close</button>
          </div>
        </div>`;
    }

    window.setReply = function(commentId) {
      replyingTo = commentId;
      drawView();
      $('cin').focus();
    };

    window.cancelReply = function() {
      replyingTo = null;
      drawView();
    };

    window.handleRequest = function(postId, applicant, accept) {
      let p = posts.find(x => x.id === postId);
      if (!p) return;
      p.pending = p.pending.filter(u => u.toLowerCase() !== applicant.toLowerCase());
      if (accept) {
        if (!p.members.map(m => m.toLowerCase()).includes(applicant.toLowerCase())) {
          p.members.push(applicant);
        }
      }
      savePosts();

      let notifs = load(NOTIFS_KEY, []);
      notifs.unshift({
        id: Date.now(),
        to: applicant,
        text: accept ? `Your request to join "${p.title}" was accepted!` : `Your request to join "${p.title}" was rejected.`,
        t: Date.now(),
        read: false
      });
      save(NOTIFS_KEY, notifs);

      drawView();
      render();
    };

    $('feed').addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('button.bookmark-btn') || e.target.closest('button.interest-fav-btn')) return;
      const card = e.target.closest('.post');
      if (!card) return;
      currentId = Number(card.dataset.id);
      replyingTo = null;
      drawView();
      $('view').showModal();
    });

    $('tags').addEventListener('click', (e) => {
      const btn = e.target.closest('.tag');
      if (!btn) return;
      activeTag = activeTag === btn.dataset.t ? null : btn.dataset.t;
      render();
    });

    $('view').addEventListener('click', async (e) => {
      const p = posts.find((x) => x.id === currentId);

      if (e.target.id === 'close' || e.target === $('view')) {$('view').close();
        return;
      }

      if (e.target.id === 'del' && p && p.author.toLowerCase() === ME) {
        if (!await ask('Delete this post?', 'This post will be removed permanently.', 'Delete', true)) return;
        posts = posts.filter((x) => x.id !== p.id);
        savePosts();
        $('view').close();
        render();
        return;
      }

      if (e.target.id === 'join' && p) {
        if (!p.members) p.members = [p.author];
        if (!p.pending) p.pending = [];

        const isMember = p.members.map(m => m.toLowerCase()).includes(ME);
        const isPending = p.pending.map(m => m.toLowerCase()).includes(ME);

        if (isMember) {
          if (p.author.toLowerCase() === ME) {
            alert("Owner cannot leave the activity.");
            return;
          }
          p.members = p.members.filter(m => m.toLowerCase() !== ME);
        } else if (isPending) {
          p.pending = p.pending.filter(m => m.toLowerCase() !== ME);
        } else {
          p.pending.push(ME);
          let notifs = load(NOTIFS_KEY, []);
          notifs.unshift({
            id: Date.now(),
            to: p.author,
            text: `${ME} wants to join your activity "${p.title}"`,
            t: Date.now(),
            read: false
          });
          save(NOTIFS_KEY, notifs);
        }
        savePosts();
        drawView();
        render();
      }
    });

    $('view').addEventListener('keydown', (e) => {
      if (e.target.id !== 'cin' || e.key !== 'Enter') return;

      const text = e.target.value.trim();
      const p = posts.find((x) => x.id === currentId);
      if (!text || !p) return;

      if (!p.comments) p.comments = [];
      p.comments.push({ id: Date.now(), parentId: replyingTo, name: ME, text, t: Date.now() });

      let notifs = load(NOTIFS_KEY, []);
      let targetUser = p.author;
      if (replyingTo) {
        let parentCmt = p.comments.find(c => c.id === replyingTo);
        if (parentCmt) targetUser = parentCmt.name;
      }

      if (targetUser.toLowerCase() !== ME.toLowerCase()) {
        notifs.unshift({
          id: Date.now(),
          to: targetUser,
          text: `${ME} replied to your comment in "${p.title}"`,
          t: Date.now(),
          read: false
        });
        save(NOTIFS_KEY, notifs);
      }

      replyingTo = null;
      savePosts();
      drawView();
      $('cin').focus();
    });

    $('q').addEventListener('input', render);

    $('theme').onclick = () => {
      const root = document.documentElement;
      const isDark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#1b1818';
      const next = isDark ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('cmuh-theme', next); } catch (e) {}
    };

    $('logout').onclick = async () => {
      if (!await ask('Log out?', 'You will need to log in again to use MorCor MaChill.', 'Log out')) return;
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      location.replace('login.html');
    };

    const params = new URLSearchParams(location.search);
    activeTag = params.get('tag');
    $('q').value = params.get('q') || '';

    render();
    updateBadges();

    const openId = Number(params.get('post'));
    if (openId && posts.some((p) => p.id === openId)) {
      currentId = openId;
      drawView();
      $('view').showModal();
    }

    window.addEventListener('storage', (e) => {
      if (e.key === MESSAGES_KEY || e.key === NOTIFS_KEY) updateBadges();
    });
  </script>
</body>
