  <dialog id="ask" class="ask">
    <h3 id="askTitle"></h3>

    <div class="row">
      <button id="askNo">Cancel</button>
      <button class="go" id="askOk">OK</button>
    </div>
  </dialog>

  <script>
    const POSTS_KEY = 'cmuh-posts2';
    const SESSION_KEY = 'cmuh-session';
    const MESSAGES_KEY = 'cmuh-messages';
    const NOTIFS_KEY = 'cmuh-notifs';
    const DEFAULT_TAGS = ['#sports', '#running', '#basketball', '#football', '#swimmingwithus'];

    const $ = (id) => document.getElementById(id);

    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch (e) { return fallback; }
    }

    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    function esc(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    function ask(title, text, okLabel, danger) {
      return new Promise((resolve) => {
        const dlg = $('ask');
        $('askTitle').textContent = title;
        $('askText').textContent = text;
        $('askOk').textContent = okLabel;
        $('askOk').className = danger ? 'go danger' : 'go';
        const done = (value) => { dlg.close(); resolve(value); };
        $('askOk').onclick = () => done(true);
        $('askNo').onclick = () => done(false);
        dlg.oncancel = () => resolve(false);
        dlg.showModal();
      });
    }

    const ME = (load(SESSION_KEY, {}).username || 'CMU').split('@')[0];
    const MY = ME.toLowerCase();

    function tagList() {
      const tags = new Set(DEFAULT_TAGS);
      load(POSTS_KEY, []).forEach((p) => (p.interest || []).forEach((t) => tags.add('#' + t.toLowerCase())));
      return [...tags];
    }

    function updateBadges() {
      const lastRead = load('cmuh-read:' + MY, {});
      const nMsg = load(MESSAGES_KEY, []).filter((m) => m.to === MY && m.t > (lastRead[m.from] || 0)).length;
      $('badge').hidden = !nMsg;

      const notifs = load(NOTIFS_KEY, []).filter((n) => n.to.toLowerCase() === MY && !n.read);
      $('notifBadge').textContent = notifs.length > 9 ? '9+' : notifs.length;
      $('notifBadge').hidden = !notifs.length;
    }

    function setLoc(loc) {
      $('location').value = loc;
    }

    $('tags').innerHTML = tagList().map((t) =>
      `<button class="tag" onclick="location.href='index.html?tag=${encodeURIComponent(t)}'">${esc(t)}</button>`
    ).join('');

    $('f').addEventListener('submit', (e) => {
      e.preventDefault();

      const interest = $('interest').value
        .split(/[,\s]+/)
        .map((t) => t.replace(/^#+/, '').trim())
        .filter(Boolean);

      const post = {
        id: Date.now(),
        author: ME,
        t: Date.now(),
        title: $('title').value.trim(),
        location: $('location').value.trim(),
        max: Math.max(2, parseInt($('max').value, 10) || 10),
        interest,
        details: $('details').value.trim(),
        members: [ME],
        pending: [],
        comments: []
      };

      const posts = load(POSTS_KEY, null) || [];
      posts.unshift(post);
      save(POSTS_KEY, posts);

      location.href = 'index.html';
    });

    $('theme').onclick = () => {
      const root = document.documentElement;
      const isDark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#1b1818';
      const next = isDark ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('cmuh-theme', next); } catch (e) {}
    };

    $('logout').onclick = async () => {
      if (!await ask('Log out?', 'You will need to log in again to use MorCor MaChill.', 'Log out')) return;
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      location.replace('login.html');
    };

    window.addEventListener('storage', (e) => {
      if (e.key === MESSAGES_KEY || e.key === NOTIFS_KEY) updateBadges();
    });

    updateBadges();
  </script>
</body>
