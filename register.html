
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMU / DekMOCHO HANGOUT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Merriweather', Georgia, serif;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .outer-frame {
            background-color: #f2f2f2;
            border: 2px solid #a855f7;
            width: 100%;
            max-width: 800px;
            min-height: 520px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
        }

        .brand-logo {
            position: absolute;
            top: 25px;
            left: 30px;
            font-weight: 700;
            font-size: 1.15rem;
            color: #000000;
            line-height: 1.3;
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease;
        }

        .header-banner {
            background-color: #1a0066;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            padding: 10px 70px;
            border-radius: 20px;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 280px;
        }

        .main-card {
            background-color: #180064;
            width: 100%;
            max-width: 440px;
            flex-grow: 1;
            border-top-left-radius: 35px;
            border-top-right-radius: 35px;
            padding: 35px 45px 30px 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 16px;
            width: 100%;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background-color: #f3f3f3;
            font-size: 0.95rem;
            color: #333333;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #a0a0a0;
            font-family: 'Merriweather', Georgia, serif;
        }

        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(254, 251, 155, 0.5);
            background-color: #ffffff;
        }

        .btn-submit-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn-submit {
            background-color: #fefb9b;
            color: #180064;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 10px 40px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        .btn-submit:hover {
            background-color: #ffffbe;
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .account-toggle-wrapper {
            text-align: center;
        }

        .account-toggle-link {
            color: #8b80f9;
            text-decoration: underline;
            font-size: 0.95rem;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 0.2s ease;
        }

        .account-toggle-link:hover {
            color: #b4acff;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 580px) {
            .brand-logo {
                position: relative;
                top: 0;
                left: 0;
                text-align: center;
                margin-bottom: 20px;
            }

            .outer-frame {
                padding-top: 20px;
                min-height: auto;
            }

            .header-banner {
                font-size: 1.6rem;
                padding: 8px 40px;
                min-width: 220px;
            }

            .main-card {
                border-top-left-radius: 25px;
                border-top-right-radius: 25px;
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="outer-frame">
        <!-- Top Left Brand Logo -->
        <div class="brand-logo" id="brandLogo">
            DekMOCHO<br>HANGOUT
        </div>

        <!-- Banner Header (LOGIN / SIGN UP) -->
        <div class="header-banner" id="headerBanner">
            LOGIN
        </div>

        <!-- Main Form Box -->
        <div class="main-card">
            <form class="auth-form" id="authForm" onsubmit="handleFormSubmit(event)">
                <!-- Username Field -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="@cmu.ac.th"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Confirm Password Field (Only visible in Sign Up view) -->
                <div class="form-group hidden" id="confirmPasswordGroup">
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="form-input" 
                        placeholder="Confirm Password"
                        autocomplete="new-password"
                    >
                </div>

                <!-- Action Button -->
                <div class="btn-submit-container">
                    <button type="submit" class="btn-submit" id="submitBtn">Login</button>
                </div>

                <!-- View Toggle Link -->
                <div class="account-toggle-wrapper">
                    <button 
                        type="button" 
                        class="account-toggle-link" 
                        id="toggleViewBtn"
                        onclick="switchView()"
                    >
                        Create a new account
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State tracking variable ('login' | 'signup')
        let currentView = 'login';

        /**
         * Switches view between 'login' and 'signup' mode dynamically
         */
        function switchView() {
            const brandLogo = document.getElementById('brandLogo');
            const headerBanner = document.getElementById('headerBanner');
            const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const submitBtn = document.getElementById('submitBtn');
            const toggleViewBtn = document.getElementById('toggleViewBtn');

            if (currentView === 'login') {
                // Change to Sign Up view
                currentView = 'signup';
                brandLogo.innerHTML = 'CMU<br>HANGOUT';
                headerBanner.textContent = 'SIGN UP';
                confirmPasswordGroup.classList.remove('hidden');
                confirmPasswordInput.setAttribute('required', 'true');
                submitBtn.textContent = 'Create an account';
                toggleViewBtn.textContent = 'Already have an account? Login';
            } else {
                // Change back to Login view
                currentView = 'login';
                brandLogo.innerHTML = 'DekMOCHO<br>HANGOUT';
                headerBanner.textContent = 'LOGIN';
                confirmPasswordGroup.classList.add('hidden');
                confirmPasswordInput.removeAttribute('required');
                submitBtn.textContent = 'Login';
                toggleViewBtn.textContent = 'Create a new account';
            }
        }

        /**
         * Form submit event handler
         */
        function handleFormSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            
            if (currentView === 'signup') {
                const pass = document.getElementById('password').value;
                const confirmPass = document.getElementById('confirmPassword').value;

                if (pass !== confirmPass) {
                    alert('Passwords do not match. Please try again.');
                    return;
                }
                alert(`Sign Up Successful for ${username}!`);
            } else {
                alert(`Login Successful for ${username}!`);
            }
        }
    </script>
</body>
</html>
