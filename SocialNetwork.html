<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MorCor MaChill</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: #f0eff1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Main Container Frame */
    .app-frame {
      position: relative;
      width: 100%;
      max-width: 820px;
      min-height: 520px;
      background-color: #f2eff1;
      border: 3px solid #b388ff;
      border-radius: 4px;
      padding: 30px 20px 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* Top Left Logo */
    .brand-logo {
      position: absolute;
      top: 25px;
      left: 30px;
      font-family: 'Times New Roman', Times, serif;
      font-weight: bold;
      font-size: 20px;
      line-height: 1.25;
      color: #000;
      letter-spacing: 0.5px;
      text-align: left;
    }

    /* Header Banner (LOGIN / SIGN UP) */
    .header-banner {
      background-color: #1a086e;
      color: #ffffff;
      width: 320px;
      padding: 12px 0;
      border-radius: 20px;
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-top: 10px;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      font-family: 'Georgia', serif;
    }

    /* Main Card Form */
    .form-card {
      background-color: #1a086e;
      width: 100%;
      max-width: 460px;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 35px 40px 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .form-group {
      width: 100%;
      margin-bottom: 18px;
    }

    .form-label {
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      font-family: 'Georgia', serif;
    }

    .form-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      background-color: #f3f3f3;
      font-size: 15px;
      color: #333;
      outline: none;
      font-family: 'Georgia', serif;
    }

    .form-input::placeholder {
      color: #a0a0a0;
      font-weight: normal;
    }

    /* Action Yellow Pill Button */
    .btn-action {
      background-color: #fbfd9b;
      color: #000000;
      border: none;
      border-radius: 25px;
      padding: 10px 40px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 20px;
      transition: all 0.2s ease;
      font-family: 'Georgia', serif;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-action:hover {
      background-color: #f5f882;
      transform: translateY(-2px);
    }

    /* Bottom Link */
    .toggle-link {
      color: #8c73e8;
      text-decoration: underline;
      font-size: 15px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      background: none;
      border: none;
      transition: color 0.2s;
    }

    .toggle-link:hover {
      color: #b39ddb;
    }

    /* Hidden element helper */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-frame">
    <!-- Top Left Brand Logo -->
    <div class="brand-logo" id="brandLogo">
      MorCor<br>MaChill
    </div>

    <!-- Top Main Title Banner -->
    <div class="header-banner" id="headerBanner">
      LOGIN
    </div>

    <!-- Form Container -->
    <div class="form-card">
      <form id="authForm" onsubmit="handleSubmit(event)" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        
        <!-- Username Field -->
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="@cmu.ac.th" required>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Password" required>
        </div>

        <!-- Confirm Password Field (Sign Up Only) -->
        <div class="form-group hidden" id="confirmPasswordGroup">
          <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm Password">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-action" id="submitBtn">
          Login
        </button>

      </form>

      <!-- Dynamic Link to Switch View -->
      <button type="button" class="toggle-link" id="toggleBtn" onclick="toggleView()">
        Create a new account
      </button>
    </div>
  </div>

  <script>
    let isSignUpMode = false;

    function toggleView() {
      isSignUpMode = !isSignUpMode;

      const headerBanner = document.getElementById('headerBanner');
      const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const submitBtn = document.getElementById('submitBtn');
      const toggleBtn = document.getElementById('toggleBtn');

      if (isSignUpMode) {
        // Switch to SIGN UP
        headerBanner.innerText = 'SIGN UP';
        confirmPasswordGroup.classList.remove('hidden');
        confirmPasswordInput.required = true;
        submitBtn.innerText = 'Create an account';
        toggleBtn.innerText = 'Already have an account?\nLogin';
      } else {
        // Switch to LOGIN
        headerBanner.innerText = 'LOGIN';
        confirmPasswordGroup.classList.add('hidden');
        confirmPasswordInput.required = false;
        submitBtn.innerText = 'Login';
        toggleBtn.innerText = 'Create a new account';
      }
    }

    function handleSubmit(event) {
      event.preventDefault();
      const username = document.getElementById('username').value;
      if (isSignUpMode) {
        const pass = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        if (pass !== confirmPass) {
          alert('Passwords do not match!');
          return;
        }
        alert(`Account created successfully for ${username}!`);
      } else {
        alert(`Logging in as ${username}...`);
      }
    }
  </script>
</body>
</html>
