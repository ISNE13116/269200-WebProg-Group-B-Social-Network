<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DekMOCHO HANGOUT - Login</title>
    <link rel="preconnect" href="https://fontsgoogleapis..com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Merriweather', Georgia, serif;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .outer-frame {
            background-color: #f2f2f2;
            border: 2px solid #a855f7;
            width: 100%;
            max-width: 800px;
            min-height: 520px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
        }

        .brand-logo {
            position: absolute;
            top: 25px;
            left: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #000000;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }

        .login-banner {
            background-color: #1a0066;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            padding: 10px 80px;
            border-radius: 20px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .login-card {
            background-color: #180064;
            width: 100%;
            max-width: 440px;
            flex-grow: 1;
            border-top-left-radius: 35px;
            border-top-right-radius: 35px;
            padding: 40px 45px 30px 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 20px;
            width: 100%;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background-color: #f3f3f3;
            font-size: 0.95rem;
            color: #333333;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #a0a0a0;
            font-family: 'Merriweather', Georgia, serif;
        }

        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(254, 251, 155, 0.5);
            background-color: #ffffff;
        }

        .btn-submit-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .btn-submit {
            background-color: #fefb9b;
            color: #180064;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 10px 45px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        .btn-submit:hover {
            background-color: #ffffbe;
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .create-account-wrapper {
            text-align: center;
        }

        .create-account-link {
            color: #8b80f9;
            text-decoration: underline;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .create-account-link:hover {
            color: #b4acff;
        }

        @media (max-width: 580px) {
            .brand-logo {
                position: relative;
                top: 0;
                left: 0;
                text-align: center;
                margin-bottom: 20px;
            }

            .outer-frame {
                padding-top: 20px;
                min-height: auto;
            }

            .login-banner {
                font-size: 1.6rem;
                padding: 8px 50px;
            }

            .login-card {
                border-top-left-radius: 25px;
                border-top-right-radius: 25px;
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="outer-frame">
        <!-- Logo Text Top Left -->
        <div class="brand-logo">
            DekMOCHO<br>HANGOUT
        </div>

        <!-- LOGIN Header Banner -->
        <div class="login-banner">
            LOGIN
        </div>

        <!-- Main Login Box -->
        <div class="login-card">
            <form class="login-form" onsubmit="event.preventDefault();">
                <!-- Username Input Group -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="@cmu.ac.th"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- Password Input Group -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Submit Button -->
                <div class="btn-submit-container">
                    <button type="submit" class="btn-submit">Login</button>
                </div>

                <!-- Create Account Link -->
                <div class="create-account-wrapper">
                    <a href="#" class="create-account-link">Create a new account</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
